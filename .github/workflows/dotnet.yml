name: RaceDayAPI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDayAPI/RaceDayAPI.csproj

      - name: Build RaceDayAPI
        run: dotnet build RaceDayAPI/RaceDayAPI.csproj --configuration Release --no-restore
